<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photon Realtime Engine</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060606;
        color: #f0f0f0;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .stats {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .badge {
        padding: 4px 8px;
        border-radius: 8px;
        background: linear-gradient(120deg, #3282ff, #6affb9);
        color: #081223;
        font-weight: 700;
        letter-spacing: 0.02em;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      a {
        color: #9ad8ff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl-canvas"></canvas>
      <div class="overlay">
        <div class="badge">Photon Realtime Engine</div>
        <div class="stats">
          <span id="fps">FPS: --</span>
          <span id="status">Mode: A</span>
        </div>
        <div class="controls">
          <label>
            <input id="mode-toggle" type="checkbox" /> Mode B (toggle for alternate shader)
          </label>
          <span style="opacity:0.8;">Move your mouse to interact with the shader.</span>
          <a href="https://developer.mozilla.org/en-US/docs/Web/API/WebGL_API" target="_blank" rel="noreferrer">WebGL2 Docs</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
